<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Keytal Consultancy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #222;
        }

        .thankyou-wrapper {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .thankyou-card {
            background: #ffffff;
            padding: 55px 45px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(84, 33, 154, 0.12);
            border: 1px solid rgba(84, 33, 154, 0.08);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            background: #54219A;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(84, 33, 154, 0.25);
        }

        .success-icon::after {
            content: "✓";
            color: #ffffff;
            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            font-size: 38px;
            line-height: 1.2;
            margin-bottom: 15px;
            color: #54219A;
        }

        .subtitle {
            font-size: 18px;
            line-height: 1.7;
            color: #666;
            margin-bottom: 30px;
        }

        .message {
            background: #f7f3fc;
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            text-decoration: none;
            background: #54219A;
            color: #ffffff;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: #40177b;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(84, 33, 154, 0.25);
        }

        .brand {
            margin-top: 25px;
            font-size: 14px;
            color: #999;
        }

        .brand strong {
            color: #54219A;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .thankyou-card {
                padding: 40px 25px;
                border-radius: 16px;
            }

            .success-icon {
                width: 70px;
                height: 70px;
            }

            .success-icon::after {
                font-size: 36px;
            }

            h1 {
                font-size: 30px;
            }

            .subtitle {
                font-size: 16px;
            }

            .home-btn {
                width: 100%;
                padding: 14px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="thankyou-wrapper">

        <div class="thankyou-card">

            <div class="success-icon"></div>

            <h1>Thank You!</h1>

            <p class="subtitle">
                Your enquiry has been successfully submitted.
            </p>

            <div class="message">
                We have received your details and our team will get in touch
                with you shortly.
            </div>

            <a href="index.html" class="home-btn">
                Back to Home
            </a>

        </div>


    </div>

</body>
</html>
